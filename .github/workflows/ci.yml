# =============================================================================
# CI 门禁（任务 14）：构建 + 全部属性/单元测试 + 消毒器（ASan/UBSan、TSan）+ pytest
# =============================================================================
# 设计依据 design.md「CI gates」：ThreadSanitizer 与 AddressSanitizer 作为
# 并发/内存安全回归的强制关卡；Python 属性测试（Hypothesis，每属性 ≥100 次迭代）
# 与 C++ 属性测试（RapidCheck）都在每次推送/PR 上运行。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-tests:
    name: C++ build + property tests (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: none
            cxxflags: ""
          - sanitizer: asan-ubsan
            cxxflags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          - sanitizer: tsan
            cxxflags: "-fsanitize=thread -fno-omit-frame-pointer -g"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # CMake 配置期校验锁定的上游子模块（CheckMooncakeVersion）
      - name: Configure
        run: >
          cmake -S . -B build -DENABLE_RAPIDCHECK=ON -DWITH_MOONCAKE_TE=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.cxxflags }}"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python-tests:
    name: Python property + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 子模块完整性冒烟测试需要锁定 commit 可见
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test toolchain
        run: pip install pytest hypothesis
      - name: Install pybind11
        run: pip install pybind11
      - name: Build Python bindings
        run: >
          cmake -S . -B build -DBUILD_PYTHON_BINDINGS=ON
          -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')"
          && cmake --build build -j"$(nproc)" --target _mooncake_kvcache
      - name: Run pytest (incl. Hypothesis property tests + binding e2e)
        run: PYTHONPATH=build/src python -m pytest tests/ -q

  clang-tidy:
    name: clang-tidy static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure (compile database)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy on project sources
        run: |
          find src -name '*.cpp' ! -path '*bindings*' ! -name 'mooncake_transfer_backend.cpp' \
            | xargs clang-tidy -p build --warnings-as-errors='*'
